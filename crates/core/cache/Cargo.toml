[package]
name = "chaty-cache"
version = "0.1.3"
edition = "2024"

[dependencies]
chaty-proto = ">=0.0.1, <1.0"

chaty-database = { path = "../database" }
chaty-config = { version = "0.1.3", path = "../config" }
chaty-result = { version = "0.1.3", path = "../result", features = ["audit"] }

deadpool-redis = { version = "0.22.0", features = ["serde", "rt_tokio_1"] }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
